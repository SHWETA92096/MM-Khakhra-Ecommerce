<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Reset Password | M M Khakhra</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            font-family: Arial, sans-serif;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;


            background-image:
                linear-gradient(
                    rgba(35, 55, 18, 0.55),
                    rgba(35, 55, 18, 0.55)
                ),
                url("images/khakhra-bg.jpg");

            background-size: cover;

            background-position: center;

            background-repeat: no-repeat;

            background-attachment: fixed;

        }


        /* ================= BACK HOME ================= */

        .back-home {

            position: fixed;

            top: 20px;

            left: 20px;

            color: white;

            text-decoration: none;

            background: rgba(255,255,255,0.15);

            backdrop-filter: blur(10px);

            padding: 10px 18px;

            border-radius: 25px;

            border: 1px solid rgba(255,255,255,0.35);

            font-size: 14px;

            font-weight: 600;

            z-index: 10;

        }


        /* ================= BOX ================= */

        .reset-box {

            width: 100%;

            max-width: 390px;

            background: rgba(255,255,255,0.97);

            padding: 30px 34px;

            border-radius: 22px;

            text-align: center;

            box-shadow:
                0 25px 60px rgba(0,0,0,0.30);

        }


        /* ================= LOGO ================= */

        .login-logo {

            width: 70px;

            height: 70px;

            object-fit: cover;

            border-radius: 50%;

            border: 4px solid #eef5df;

            margin-bottom: 8px;

        }


        .brand-name {

            font-size: 23px;

            font-weight: 800;

            color: #5d7f31;

        }


        .brand-tagline {

            color: #888;

            font-size: 12px;

            margin-top: 3px;

            margin-bottom: 20px;

        }


        /* ================= ICON ================= */

        .reset-icon {

            width: 45px;

            height: 45px;

            margin: auto;

            margin-bottom: 12px;

            border-radius: 13px;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #eef5df;

            color: #638633;

            font-size: 18px;

        }


        h1 {

            font-size: 25px;

            color: #222;

            margin-bottom: 7px;

        }


        .subtitle {

            color: #888;

            font-size: 13px;

            margin-bottom: 20px;

        }


        /* ================= INPUT ================= */

        .input-group {

            position: relative;

            margin-bottom: 14px;

        }


        .input-group > i:first-child {

            position: absolute;

            left: 15px;

            top: 50%;

            transform: translateY(-50%);

            color: #6d8c3d;

        }


        .input-group input {

            width: 100%;

            height: 48px;

            padding: 0 43px;

            border: 1px solid #dfe5d7;

            border-radius: 11px;

            background: #fafcf8;

            outline: none;

            font-size: 13px;

        }


        .input-group input:focus {

            background: white;

            border-color: #6d8c3d;

            box-shadow:
                0 0 0 3px rgba(109,140,61,0.10);

        }


        /* ================= EYE ================= */

        .password-eye {

            position: absolute;

            right: 15px;

            top: 50%;

            transform: translateY(-50%);

            color: #888;

            cursor: pointer;

        }


        /* ================= BUTTON ================= */

        .reset-btn {

            width: 100%;

            height: 48px;

            border: none;

            border-radius: 11px;

            background:
                linear-gradient(
                    135deg,
                    #55782c,
                    #83a94a
                );

            color: white;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;

            margin-top: 5px;

        }


        .reset-btn:hover {

            transform: translateY(-2px);

        }


        /* ================= MESSAGE ================= */

        #message {

            margin-top: 15px;

            font-size: 13px;

            font-weight: 600;

        }


        .back-login {

            display: block;

            margin-top: 18px;

            color: #6d8c3d;

            text-decoration: none;

            font-size: 13px;

            font-weight: 600;

        }

    </style>

</head>


<body>


<a href="index.html" class="back-home">

    <i class="fa-solid fa-arrow-left"></i>

    Back to Home

</a>


<div class="reset-box">


    <img
        src="images/logo.png"
        alt="M M Khakhra"
        class="login-logo"
    >


    <div class="brand-name">
        M M Khakhra
    </div>


    <div class="brand-tagline">
        Fresh • Crispy • Healthy
    </div>


    <div class="reset-icon">

        <i class="fa-solid fa-key"></i>

    </div>


    <h1>
        Reset Password
    </h1>


    <p class="subtitle">
        Enter your new password below
    </p>


    <form id="resetPasswordForm">


        <!-- NEW PASSWORD -->

        <div class="input-group">

            <i class="fa-solid fa-lock"></i>

            <input
                type="password"
                id="newPassword"
                placeholder="New Password"
                minlength="6"
                required
            >

            <i
                class="fa-solid fa-eye password-eye"
                id="toggleNewPassword">
            </i>

        </div>


        <!-- CONFIRM PASSWORD -->

        <div class="input-group">

            <i class="fa-solid fa-lock"></i>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm Password"
                minlength="6"
                required
            >

            <i
                class="fa-solid fa-eye password-eye"
                id="toggleConfirmPassword">
            </i>

        </div>


        <button
            type="submit"
            class="reset-btn">

            <i class="fa-solid fa-key"></i>

            Reset Password

        </button>


    </form>


    <div id="message"></div>


    <a
        href="login.html"
        class="back-login">

        ← Back to Login

    </a>


</div>


<script>

const form =
    document.getElementById("resetPasswordForm");

const message =
    document.getElementById("message");


/* ================= GET TOKEN ================= */

const currentURL = window.location.href;

console.log("CURRENT URL:", currentURL);

const urlParams = new URLSearchParams(window.location.search);
const token = urlParams.get("token");

console.log("RESET TOKEN:", token);
console.log("TOKEN LENGTH:", token ? token.length : 0);

/* ================= CHECK TOKEN ================= */

if (!token) {
    message.style.color = "red";
    message.innerText =
        "Token is missing. URL received: " + window.location.href;
} else {
    message.style.color = "green";
    message.innerText =
        "Token received successfully. Token length: " + token.length;
}

/* ================= RESET PASSWORD ================= */

form.addEventListener("submit", async function(event) {

    event.preventDefault();


    const newPassword =
        document
            .getElementById("newPassword")
            .value;

    const confirmPassword =
        document
            .getElementById("confirmPassword")
            .value;


    /* CHECK PASSWORD */

    if (newPassword.length < 6) {

        message.style.color = "red";

        message.innerText =
            "Password must be at least 6 characters.";

        return;

    }


    /* CONFIRM PASSWORD */

    if (newPassword !== confirmPassword) {

        message.style.color = "red";

        message.innerText =
            "Passwords do not match.";

        return;

    }


    /* CHECK TOKEN */

    if (!token) {

        message.style.color = "red";

        message.innerText =
            "Invalid or missing reset token.";

        return;

    }


    try {

        const response = await fetch(
            "https://mm-khakhra-ecommerce.onrender.com/api/auth/reset-password",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    token: token,

                    password: newPassword

                })
            }
        );


        const data =
            await response.json();


        if (response.ok) {

            message.style.color = "#5d7f31";

            message.innerText =
                "Password reset successfully!";


            form.reset();


            setTimeout(function() {

                window.location.href =
                    "login.html";

            }, 2000);


        } else {

            message.style.color = "red";

            message.innerText =
                data.message ||
                "Unable to reset password.";

        }


    } catch (error) {

        console.error(
            "Reset Password Error:",
            error
        );

        message.style.color = "red";

        message.innerText =
            "Unable to connect to the server.";

    }

});


/* ================= SHOW / HIDE NEW PASSWORD ================= */

document
    .getElementById("toggleNewPassword")
    .addEventListener("click", function() {

        const input =
            document.getElementById("newPassword");

        if (input.type === "password") {

            input.type = "text";

            this.classList.remove("fa-eye");

            this.classList.add("fa-eye-slash");

        } else {

            input.type = "password";

            this.classList.remove("fa-eye-slash");

            this.classList.add("fa-eye");

        }

    });


/* ================= SHOW / HIDE CONFIRM PASSWORD ================= */

document
    .getElementById("toggleConfirmPassword")
    .addEventListener("click", function() {

        const input =
            document.getElementById("confirmPassword");

        if (input.type === "password") {

            input.type = "text";

            this.classList.remove("fa-eye");

            this.classList.add("fa-eye-slash");

        } else {

            input.type = "password";

            this.classList.remove("fa-eye-slash");

            this.classList.add("fa-eye");

        }

    });

</script>


</body>

</html>
