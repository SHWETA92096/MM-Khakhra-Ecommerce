<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up | M M Khakhra</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            font-family: Arial, sans-serif;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;

            /* ================= BACKGROUND ================= */

            background-image:
                linear-gradient(
                    rgba(35, 55, 18, 0.55),
                    rgba(35, 55, 18, 0.55)
                ),
                url("images/khakhra-bg.jpg");

            background-size: cover;

            background-position: center;

            background-repeat: no-repeat;

            background-attachment: fixed;

        }


        /* ================= DECORATIVE CIRCLES ================= */

        body::before {

            content: "";

            position: fixed;

            width: 350px;
            height: 350px;

            border-radius: 50%;

            background: rgba(255,255,255,0.08);

            top: -120px;

            left: -100px;

            z-index: 0;

        }


        body::after {

            content: "";

            position: fixed;

            width: 400px;
            height: 400px;

            border-radius: 50%;

            background: rgba(255,255,255,0.07);

            bottom: -180px;

            right: -120px;

            z-index: 0;

        }


        /* ================= BACK HOME ================= */

        .back-home {

            position: fixed;

            top: 20px;

            left: 20px;

            color: white;

            text-decoration: none;

            background: rgba(255,255,255,0.15);

            backdrop-filter: blur(10px);

            padding: 10px 18px;

            border-radius: 25px;

            border: 1px solid rgba(255,255,255,0.35);

            font-size: 14px;

            font-weight: 600;

            z-index: 10;

            transition: 0.3s;

        }


        .back-home:hover {

            background: white;

            color: #5d7f31;

            transform: translateY(-2px);

        }


        /* ================= SIGNUP BOX ================= */

        .signup-box {

            position: relative;

            z-index: 5;

            width: 100%;

            max-width: 410px;

            background: rgba(255,255,255,0.97);

            padding: 25px 34px 22px;

            border-radius: 22px;

            text-align: center;

            box-shadow:
                0 25px 60px rgba(0,0,0,0.30);

            border: 1px solid rgba(255,255,255,0.8);

            animation: appear 0.7s ease;

        }


        @keyframes appear {

            from {

                opacity: 0;

                transform: translateY(30px) scale(0.97);

            }

            to {

                opacity: 1;

                transform: translateY(0) scale(1);

            }

        }


        /* ================= LOGO ================= */

        .signup-logo {

            width: 65px;

            height: 65px;

            object-fit: cover;

            border-radius: 50%;

            border: 4px solid #eef5df;

            margin-bottom: 5px;

        }


        .brand-name {

            font-size: 23px;

            font-weight: 800;

            color: #5d7f31;

        }


        .brand-tagline {

            color: #888;

            font-size: 12px;

            margin-top: 3px;

            margin-bottom: 13px;

        }


        /* ================= ICON ================= */

        .signup-icon {

            width: 43px;

            height: 43px;

            margin: auto;

            margin-bottom: 9px;

            border-radius: 13px;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #eef5df;

            color: #638633;

            font-size: 18px;

        }


        .signup-box h1 {

            font-size: 24px;

            color: #222;

            margin-bottom: 5px;

        }


        .signup-subtitle {

            color: #888;

            font-size: 13px;

            margin-bottom: 17px;

        }


        /* ================= INPUT ================= */

        .input-group {

            position: relative;

            margin-bottom: 11px;

        }


        .input-group > i:first-child {

            position: absolute;

            left: 15px;

            top: 50%;

            transform: translateY(-50%);

            color: #6d8c3d;

            font-size: 15px;

        }


        .input-group input {

            width: 100%;

            height: 46px;

            padding: 0 43px;

            border: 1px solid #dfe5d7;

            border-radius: 11px;

            background: #fafcf8;

            outline: none;

            font-size: 13px;

            transition: 0.3s;

        }


        .input-group input:focus {

            background: white;

            border-color: #6d8c3d;

            box-shadow:
                0 0 0 3px rgba(109,140,61,0.10);

        }


        .input-group input::placeholder {

            color: #aaa;

        }


        /* ================= PASSWORD EYE ================= */

        .password-eye {

            position: absolute;

            right: 15px;

            top: 50%;

            transform: translateY(-50%);

            color: #888;

            cursor: pointer;

        }


        .password-eye:hover {

            color: #6d8c3d;

        }


        /* ================= TERMS ================= */

        .terms {

            display: flex;

            align-items: flex-start;

            gap: 7px;

            text-align: left;

            margin: 5px 0 15px;

            color: #777;

            font-size: 11px;

            line-height: 1.4;

        }


        .terms input {

            margin-top: 2px;

            accent-color: #6d8c3d;

        }


        .terms a {

            color: #638633;

            text-decoration: none;

            font-weight: 600;

        }


        /* ================= SIGNUP BUTTON ================= */

        .signup-btn {

            width: 100%;

            height: 47px;

            border: none;

            border-radius: 11px;

            background:
                linear-gradient(
                    135deg,
                    #55782c,
                    #83a94a
                );

            color: white;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;

            box-shadow:
                0 8px 18px rgba(85,120,44,0.25);

            transition: 0.3s;

        }


        .signup-btn:hover {

            transform: translateY(-2px);

            box-shadow:
                0 12px 25px rgba(85,120,44,0.35);

        }


        .signup-btn i {

            margin-right: 6px;

        }


        /* ================= LOGIN LINK ================= */

        .login-text {

            margin-top: 14px;

            color: #777;

            font-size: 12px;

        }


        .login-text a {

            color: #5d7f31;

            font-weight: 700;

            text-decoration: none;

        }


        .login-text a:hover {

            text-decoration: underline;

        }


        /* ================= SECURITY ================= */

        .security-text {

            margin-top: 10px;

            color: #aaa;

            font-size: 10px;

        }


        .security-text i {

            color: #6d8c3d;

            margin-right: 3px;

        }


        /* ================= MOBILE ================= */

        @media(max-width: 500px) {

            body {

                padding: 15px;

            }


            .signup-box {

                max-width: 350px;

                padding: 23px 24px 20px;

            }


            .back-home {

                top: 12px;

                left: 12px;

                font-size: 12px;

                padding: 8px 13px;

            }


            .signup-logo {

                width: 58px;

                height: 58px;

            }


            .brand-name {

                font-size: 21px;

            }


            .signup-box h1 {

                font-size: 22px;

            }

        }

    </style>

</head>


<body>


<!-- ================= BACK HOME ================= -->

<a href="index.html" class="back-home">

    <i class="fa-solid fa-arrow-left"></i>

    Back to Home

</a>



<!-- ================= SIGNUP BOX ================= -->

<div class="signup-box">


    <!-- Logo -->

    <img
        src="images/logo.png"
        alt="M M Khakhra"
        class="signup-logo"
    >


    <div class="brand-name">
        M M Khakhra
    </div>


    <div class="brand-tagline">
        Fresh • Crispy • Healthy
    </div>


    <!-- Signup Icon -->

    <div class="signup-icon">

        <i class="fa-solid fa-user-plus"></i>

    </div>


    <h1>
        Create Account ✨
    </h1>


    <p class="signup-subtitle">
        Join us and start shopping
    </p>



    <!-- ================= FORM ================= -->

    <form id="signupForm">


        <!-- Name -->

        <div class="input-group">

            <i class="fa-solid fa-user"></i>

            <input
                type="text"
                id="name"
                placeholder="Full Name"
                required
            >

        </div>


        <!-- Email -->

        <div class="input-group">

            <i class="fa-solid fa-envelope"></i>

            <input
                type="email"
                id="email"
                placeholder="Email Address"
                required
            >

        </div>


        <!-- Password -->

        <div class="input-group">

            <i class="fa-solid fa-lock"></i>

            <input
                type="password"
                id="password"
                placeholder="Create Password"
                required
            >

            <i
                class="fa-solid fa-eye password-eye"
                id="togglePassword">
            </i>

        </div>


        <!-- Confirm Password -->

        <div class="input-group">

            <i class="fa-solid fa-lock"></i>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm Password"
                required
            >

            <i
                class="fa-solid fa-eye password-eye"
                id="toggleConfirmPassword">
            </i>

        </div>


        <!-- Terms -->

        <label class="terms">

            <input
                type="checkbox"
                id="terms"
                required
            >

            <span>

                I agree to the
                <a href="#">
                    Terms & Conditions
                </a>
                and
                <a href="#">
                    Privacy Policy
                </a>.

            </span>

        </label>


        <!-- Signup Button -->

        <button
            type="submit"
            class="signup-btn">

            <i class="fa-solid fa-user-plus"></i>

            Create Account

        </button>


    </form>


    <!-- Login -->

    <p class="login-text">

        Already have an account?

        <a href="login.html">
            Login
        </a>

    </p>


    <!-- Security -->

    <p class="security-text">

        <i class="fa-solid fa-shield-halved"></i>

        Secure Registration • Your information is protected

    </p>


</div>



<!-- ================= SIGNUP JS ================= -->

<script src="js/signup.js"></script>


<script>

    // ================= PASSWORD TOGGLE =================

    const password =
        document.getElementById("password");

    const confirmPassword =
        document.getElementById("confirmPassword");

    const togglePassword =
        document.getElementById("togglePassword");

    const toggleConfirmPassword =
        document.getElementById("toggleConfirmPassword");


    togglePassword.addEventListener("click", function () {

        if (password.type === "password") {

            password.type = "text";

            this.classList.remove("fa-eye");

            this.classList.add("fa-eye-slash");

        } else {

            password.type = "password";

            this.classList.remove("fa-eye-slash");

            this.classList.add("fa-eye");

        }

    });


    toggleConfirmPassword.addEventListener("click", function () {

        if (confirmPassword.type === "password") {

            confirmPassword.type = "text";

            this.classList.remove("fa-eye");

            this.classList.add("fa-eye-slash");

        } else {

            confirmPassword.type = "password";

            this.classList.remove("fa-eye-slash");

            this.classList.add("fa-eye");

        }

    });

</script>


</body>

</html>
